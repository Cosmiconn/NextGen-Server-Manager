name: Windows Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ui/**'
      - 'research/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve source tree
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'src\NextGen.Fiesta.ServerManager\NextGen.Fiesta.ServerManager.csproj'
          if (Test-Path $project) {
            "SOURCE_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
            Write-Host 'Using expanded source tree from repository root.'
          }
          else {
            $restored = Join-Path $env:GITHUB_WORKSPACE '_restored-source'
            .\scripts\Restore-Baseline.ps1 -Destination $restored
            "SOURCE_ROOT=$restored" >> $env:GITHUB_ENV
            Write-Host "Using restored 0.3.4 baseline source: $restored"
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:SOURCE_ROOT\NextGen.Fiesta.ServerManager.sln"

      - name: Build Release x64
        shell: pwsh
        run: dotnet build "$env:SOURCE_ROOT\NextGen.Fiesta.ServerManager.sln" -c Release --no-restore -p:Platform=x64

      - name: Publish win-x64
        shell: pwsh
        run: dotnet publish "$env:SOURCE_ROOT\src\NextGen.Fiesta.ServerManager\NextGen.Fiesta.ServerManager.csproj" -c Release -r win-x64 --self-contained false --no-restore -o "$env:GITHUB_WORKSPACE\artifacts\win-x64"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Fiesta-Server-Manager-win-x64
          path: artifacts/win-x64
          if-no-files-found: error

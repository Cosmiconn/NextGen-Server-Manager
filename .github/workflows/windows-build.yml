name: Windows Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ui/**'
      - 'research/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          $project = Join-Path $repo 'src\NextGen.Fiesta.ServerManager\NextGen.Fiesta.ServerManager.csproj'

          if (Test-Path -LiteralPath $project) {
            "SOURCE_ROOT=$repo" >> $env:GITHUB_ENV
            Write-Host 'Using expanded source tree from repository root.'
            exit 0
          }

          $archive = Join-Path $repo 'NextGen-Fiesta-Server-Manager-0.3.4-Hardware-Aware.zip'
          $expectedSha256 = '140143278290fb96c1dd4ef047229c4b8c4b26c9826def0a5d4ebcac1bd2dba7'
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Neither expanded source nor baseline ZIP is available. Missing: $archive"
          }

          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Baseline ZIP checksum mismatch. Expected $expectedSha256, got $actualSha256"
          }

          $restore = Join-Path $repo '_restored-source'
          if (Test-Path -LiteralPath $restore) {
            Remove-Item -LiteralPath $restore -Recurse -Force
          }
          New-Item -ItemType Directory -Path $restore | Out-Null

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $restore)

          $solution = Get-ChildItem -LiteralPath $restore -Filter 'NextGen.Fiesta.ServerManager.sln' -File -Recurse | Select-Object -First 1
          if (-not $solution) {
            throw 'Baseline ZIP does not contain NextGen.Fiesta.ServerManager.sln.'
          }

          $sourceRoot = $solution.Directory.FullName
          $restoredProject = Join-Path $sourceRoot 'src\NextGen.Fiesta.ServerManager\NextGen.Fiesta.ServerManager.csproj'
          if (-not (Test-Path -LiteralPath $restoredProject)) {
            throw "Restored WPF project missing: $restoredProject"
          }

          "SOURCE_ROOT=$sourceRoot" >> $env:GITHUB_ENV
          Write-Host "Using restored 0.3.4 baseline source: $sourceRoot"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:SOURCE_ROOT\NextGen.Fiesta.ServerManager.sln"

      - name: Build Release
        shell: pwsh
        run: dotnet build "$env:SOURCE_ROOT\NextGen.Fiesta.ServerManager.sln" -c Release --no-restore

      - name: Publish win-x64
        shell: pwsh
        run: dotnet publish "$env:SOURCE_ROOT\src\NextGen.Fiesta.ServerManager\NextGen.Fiesta.ServerManager.csproj" -c Release -r win-x64 --self-contained false --no-restore -o "$env:GITHUB_WORKSPACE\artifacts\win-x64"

      - name: WPF startup resize and navigation smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\win-x64\NextGen.Fiesta.ServerManager.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Published executable missing: $exe"
          }

          $startupLog = Join-Path $env:LOCALAPPDATA 'NextGenFiestaServerManager\startup.log'
          Remove-Item -LiteralPath $startupLog -Force -ErrorAction SilentlyContinue
          $uiSmokeDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\ui-smoke'
          if (Test-Path -LiteralPath $uiSmokeDir) {
            Remove-Item -LiteralPath $uiSmokeDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $uiSmokeDir | Out-Null

          $env:NEXTGEN_UI_SMOKE_RESIZE = '1'
          $env:NEXTGEN_UI_SMOKE_SCREENSHOT_DIR = $uiSmokeDir
          $process = Start-Process -FilePath $exe -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(40)
            $shown = $false
            $resized = $false
            $navigated = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()

              if (Test-Path -LiteralPath $startupLog) {
                $startupText = Get-Content -LiteralPath $startupLog -Raw -ErrorAction SilentlyContinue
                if ($startupText -match 'FATAL ') {
                  Write-Host $startupText
                  throw 'WPF startup/resize/navigation log contains a fatal exception.'
                }
                if ($startupText -match 'MainWindow successfully shown\.') { $shown = $true }
                if ($startupText -match 'UI_SMOKE_NAV completed\.') { $navigated = $true }
                if ($startupText -match 'UI_SMOKE_RESIZE completed\.') {
                  $resized = $true
                  break
                }
              }

              if ($process.HasExited) {
                $exitCode = $process.ExitCode
                $startupText = if (Test-Path -LiteralPath $startupLog) { Get-Content -LiteralPath $startupLog -Raw } else { '<startup.log missing>' }
                Write-Host $startupText
                throw "WPF process exited during startup/resize/navigation smoke test with code $exitCode."
              }
            }

            $startupText = if (Test-Path -LiteralPath $startupLog) { Get-Content -LiteralPath $startupLog -Raw } else { '<startup.log missing>' }
            Write-Host $startupText
            if (-not $shown) { throw 'MainWindow did not report successful Show() within 40 seconds.' }
            if (-not $navigated) { throw 'Navigation smoke did not complete within 40 seconds.' }
            if (-not $resized) { throw 'Responsive resize smoke did not complete within 40 seconds.' }
            if ($startupText -match 'FATAL ') { throw 'WPF runtime smoke log contains a fatal exception.' }
            if ($startupText -notmatch 'target=720x620 actual=720x620') {
              throw 'Responsive smoke did not actually reach the 720x620 breakpoint.'
            }

            $screenshots = @(Get-ChildItem -LiteralPath $uiSmokeDir -Filter '*.png' -File)
            if ($screenshots.Count -lt 16) {
              throw "Expected at least sixteen rendered UI screenshots, found $($screenshots.Count)."
            }
            if (-not ($screenshots.Name -match 'ui-target-720x620-actual-720x620\.png')) {
              throw 'Missing exact 720x620 rendered UI screenshot.'
            }

            $requiredViews = @(
              'ui-nav-dashboard-',
              'ui-nav-server-zone-capacity-',
              'ui-nav-server-limits-',
              'ui-nav-server-adaptive-hooks-',
              'ui-nav-server-performance-overflow-',
              'ui-nav-diagnostic-logs-',
              'ui-nav-diagnostic-timeline-',
              'ui-nav-diagnostic-pdb-',
              'ui-nav-tools-client-map-safety-',
              'ui-utility-settings-',
              'ui-utility-manual-',
              'ui-utility-credits-'
            )
            foreach ($viewPrefix in $requiredViews) {
              if (-not ($screenshots.Name | Where-Object { $_ -like "$viewPrefix*" })) {
                throw "Missing rendered UI screenshot: $viewPrefix"
              }
            }
            Write-Host "Rendered UI screenshots: $($screenshots.Name -join ', ')"

            $process.Refresh()
            if ($process.HasExited) {
              throw "WPF process exited unexpectedly after UI smoke with code $($process.ExitCode)."
            }
          }
          finally {
            Remove-Item Env:NEXTGEN_UI_SMOKE_RESIZE -ErrorAction SilentlyContinue
            Remove-Item Env:NEXTGEN_UI_SMOKE_SCREENSHOT_DIR -ErrorAction SilentlyContinue
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Fiesta-Server-Manager-win-x64
          path: artifacts/win-x64
          if-no-files-found: error

      - name: Upload UI smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Fiesta-Server-Manager-ui-smoke
          path: artifacts/ui-smoke
          if-no-files-found: error

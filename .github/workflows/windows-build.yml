name: Windows Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ui/**'
      - 'research/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore baseline source
        shell: pwsh
        run: .\scripts\Restore-Baseline.ps1 -Destination "$env:GITHUB_WORKSPACE\_src"

      - name: Restore
        working-directory: _src
        run: dotnet restore NextGen.Fiesta.ServerManager.sln

      - name: Build Release x64
        working-directory: _src
        run: dotnet build NextGen.Fiesta.ServerManager.sln -c Release --no-restore -p:Platform=x64

      - name: Publish win-x64
        working-directory: _src
        run: dotnet publish src/NextGen.Fiesta.ServerManager/NextGen.Fiesta.ServerManager.csproj -c Release -r win-x64 --self-contained false --no-restore -o ../artifacts/win-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Fiesta-Server-Manager-win-x64
          path: artifacts/win-x64
          if-no-files-found: error

name: Windows Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ui/**'
      - 'research/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          $project = Join-Path $repo 'src\NextGen.Fiesta.ServerManager\NextGen.Fiesta.ServerManager.csproj'

          if (Test-Path -LiteralPath $project) {
            "SOURCE_ROOT=$repo" >> $env:GITHUB_ENV
            Write-Host 'Using expanded source tree from repository root.'
            exit 0
          }

          $archive = Join-Path $repo 'NextGen-Fiesta-Server-Manager-0.3.4-Hardware-Aware.zip'
          $expectedSha256 = '140143278290fb96c1dd4ef047229c4b8c4b26c9826def0a5d4ebcac1bd2dba7'
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Neither expanded source nor baseline ZIP is available. Missing: $archive"
          }

          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Baseline ZIP checksum mismatch. Expected $expectedSha256, got $actualSha256"
          }

          $restore = Join-Path $repo '_restored-source'
          if (Test-Path -LiteralPath $restore) {
            Remove-Item -LiteralPath $restore -Recurse -Force
          }
          New-Item -ItemType Directory -Path $restore | Out-Null

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $restore)

          $solution = Get-ChildItem -LiteralPath $restore -Filter 'NextGen.Fiesta.ServerManager.sln' -File -Recurse | Select-Object -First 1
          if (-not $solution) {
            throw 'Baseline ZIP does not contain NextGen.Fiesta.ServerManager.sln.'
          }

          $sourceRoot = $solution.Directory.FullName
          $restoredProject = Join-Path $sourceRoot 'src\NextGen.Fiesta.ServerManager\NextGen.Fiesta.ServerManager.csproj'
          if (-not (Test-Path -LiteralPath $restoredProject)) {
            throw "Restored WPF project missing: $restoredProject"
          }

          "SOURCE_ROOT=$sourceRoot" >> $env:GITHUB_ENV
          Write-Host "Using restored 0.3.4 baseline source: $sourceRoot"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:SOURCE_ROOT\NextGen.Fiesta.ServerManager.sln"

      - name: Build Release
        shell: pwsh
        run: dotnet build "$env:SOURCE_ROOT\NextGen.Fiesta.ServerManager.sln" -c Release --no-restore

      - name: Publish win-x64
        shell: pwsh
        run: dotnet publish "$env:SOURCE_ROOT\src\NextGen.Fiesta.ServerManager\NextGen.Fiesta.ServerManager.csproj" -c Release -r win-x64 --self-contained false --no-restore -o "$env:GITHUB_WORKSPACE\artifacts\win-x64"

      - name: WPF startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\win-x64\NextGen.Fiesta.ServerManager.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Published executable missing: $exe"
          }

          $startupLog = Join-Path $env:LOCALAPPDATA 'NextGenFiestaServerManager\startup.log'
          Remove-Item -LiteralPath $startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(12)
            $shown = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()

              if (Test-Path -LiteralPath $startupLog) {
                $startupText = Get-Content -LiteralPath $startupLog -Raw -ErrorAction SilentlyContinue
                if ($startupText -match 'FATAL ') {
                  Write-Host $startupText
                  throw 'WPF startup log contains a fatal exception.'
                }
                if ($startupText -match 'MainWindow successfully shown\.') {
                  $shown = $true
                  break
                }
              }

              if ($process.HasExited) {
                $exitCode = $process.ExitCode
                $startupText = if (Test-Path -LiteralPath $startupLog) { Get-Content -LiteralPath $startupLog -Raw } else { '<startup.log missing>' }
                Write-Host $startupText
                throw "WPF process exited during startup smoke test with code $exitCode."
              }
            }

            if (-not $shown) {
              $startupText = if (Test-Path -LiteralPath $startupLog) { Get-Content -LiteralPath $startupLog -Raw } else { '<startup.log missing>' }
              Write-Host $startupText
              throw 'MainWindow did not report successful Show() within 12 seconds.'
            }

            # Keep the dispatcher alive a little longer so Loaded/SizeChanged handlers,
            # runtime styles and responsive shell construction can fail the test too.
            Start-Sleep -Seconds 4
            $process.Refresh()
            $startupText = if (Test-Path -LiteralPath $startupLog) { Get-Content -LiteralPath $startupLog -Raw } else { '<startup.log missing>' }
            Write-Host $startupText
            if ($startupText -match 'FATAL ') {
              throw 'WPF runtime smoke log contains a fatal exception after Show().'
            }
            if ($process.HasExited) {
              throw "WPF process exited unexpectedly after Show() with code $($process.ExitCode)."
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Fiesta-Server-Manager-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
